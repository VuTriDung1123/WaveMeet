{% extends "chat/base.html" %}

{% block content %}
<div class="w-full max-w-md p-8 glass-panel rounded-[2rem] mx-4 my-auto mt-20">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Welcome Back 🌸</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-pink-700">{{ field.label }}</label>
            {{ field.errors }}
            <div class="mt-1">
                <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" id="{{ field.id_for_label }}"
                       class="w-full px-4 py-2 kawaii-input text-gray-700" 
                       {% if field.field.required %}required{% endif %}>
            </div>
        </div>
        {% endfor %}
        <button type="submit" class="w-full py-3 mt-4 rounded-full font-bold kawaii-btn text-lg">
            Đăng Nhập <i class="fa-solid fa-arrow-right ml-2"></i>
        </button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-600 font-medium">
        Chưa có tài khoản? <a href="{% url 'register' %}" class="text-pink-600 font-bold hover:underline">Đăng ký ngay</a>
    </p>
</div>
{% endblock %}
