{% extends "chat/base.html" %}

{% block content %}
<h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Join WaveMeet 🌸</h2>
<form method="post" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <div>
        <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">{{ field.label }}</label>
        {{ field.errors }}
        <div class="mt-1">
            <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" id="{{ field.id_for_label }}"
                   class="w-full px-4 py-2 kawaii-input" 
                   {% if field.field.required %}required{% endif %}>
        </div>
        {% if field.help_text %}
        <p class="text-xs text-gray-500 mt-1">{{ field.help_text }}</p>
        {% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="w-full py-3 rounded-full font-bold kawaii-btn">
        Đăng Ký
    </button>
</form>
<p class="mt-4 text-center text-sm text-gray-600">
    Đã có tài khoản? <a href="{% url 'login' %}" class="text-pink-500 font-semibold hover:underline">Đăng nhập</a>
</p>
{% endblock %}
