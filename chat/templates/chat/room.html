<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room {{ room.id }} - WaveMeet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include LiveKit JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        body {
            background-color: #ffe6f2; 
            font-family: 'Nunito', sans-serif;
            overflow: hidden; 
        }
        .kawaii-shadow { box-shadow: 0 10px 25px rgba(255, 182, 193, 0.5); }
        .kawaii-input {
            border: 2px solid #ffb6c1;
            border-radius: 9999px; 
        }
        .kawaii-input:focus {
            outline: none;
            border-color: #ff69b4;
            box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.3);
        }
        .chat-bubble-me {
            background-color: #ffb6c1;
            color: white;
            border-radius: 18px 18px 4px 18px;
        }
        .chat-bubble-other {
            background-color: white;
            color: #4a5568;
            border: 1px solid #fed7e2;
            border-radius: 18px 18px 18px 4px;
        }
        /* Video Grid Styles */
        #video-grid {
            display: grid;
            gap: 1rem;
            width: 100%;
            height: 100%;
            padding: 1rem;
            box-sizing: border-box;
            /* Default 1x1 */
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
        }
        #video-grid.grid-2 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr;
        }
        #video-grid.grid-3, #video-grid.grid-4 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }
        #video-grid.grid-5, #video-grid.grid-6 {
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }
        #video-grid.grid-9 {
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #1a202c;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 10;
        }
        
        /* Control Bar */
        .controls-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 9999px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 20;
        }
        .control-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            color: white;
        }
        .btn-active { background-color: #ff69b4; }
        .btn-inactive { background-color: #a0aec0; }
        .btn-end { background-color: #f56565; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="h-screen flex">
    
    <!-- Main Video Area -->
    <div class="flex-1 flex flex-col p-4 relative">
        <div class="flex justify-between items-center bg-white p-4 rounded-2xl kawaii-shadow mb-4 z-10">
            <h1 class="text-xl font-bold text-gray-800">Room: <span class="text-pink-500 text-sm font-normal break-all">{{ room.id }}</span></h1>
        </div>
        
        <!-- Grid Container -->
        <div class="flex-1 bg-pink-50 rounded-3xl kawaii-shadow relative overflow-hidden" id="grid-wrapper">
            <div id="video-grid">
                <!-- Local Video -->
                <div class="video-container" id="video-container-local">
                    <video id="local-video" autoplay playsinline muted></video>
                    <div class="video-label">Bạn ({{ user.username }})</div>
                </div>
            </div>
            
            <!-- Controls -->
            <div class="controls-bar">
                <button id="btn-toggle-mic" class="control-btn btn-active" title="Toggle Mic">
                    🎤
                </button>
                <button id="btn-toggle-cam" class="control-btn btn-active" title="Toggle Camera">
                    📷
                </button>
                <button id="btn-share-screen" class="control-btn btn-inactive" title="Share Screen">
                    💻
                </button>
                <a href="{% url 'home' %}" class="control-btn btn-end" title="Leave Room" style="text-decoration:none;">
                    👋
                </a>
            </div>
        </div>
    </div>

    <!-- Chat Sidebar -->
    <div class="w-80 bg-white border-l-2 border-pink-100 flex flex-col h-full kawaii-shadow z-10 relative">
        <div class="p-4 border-b border-pink-100 bg-pink-50">
            <h2 class="font-bold text-gray-800 text-lg">Live Chat 🌸</h2>
        </div>
        
        <div id="chat-log" class="flex-1 p-4 overflow-y-auto space-y-4">
            <div class="text-center text-xs text-gray-400 my-2">-- Welcome to the chat --</div>
        </div>
        
        <div class="p-4 border-t border-pink-100">
            <form id="chat-form" class="flex items-center space-x-2">
                <input id="chat-message-input" type="text" class="flex-1 px-4 py-2 kawaii-input text-sm" placeholder="Nhập tin nhắn..." autocomplete="off">
                <button type="submit" class="p-2 rounded-full bg-pink-400 text-white hover:bg-pink-500 transition-colors">
                    ➤
                </button>
            </form>
        </div>
    </div>

    {{ room.id|json_script:"room-id" }}
    {{ user.username|json_script:"user-name" }}
    {{ livekit_token|json_script:"livekit-token" }}
    {{ livekit_url|json_script:"livekit-url" }}

    <script>
        const roomId = JSON.parse(document.getElementById('room-id').textContent);
        const currentUsername = JSON.parse(document.getElementById('user-name').textContent);
        const livekitToken = JSON.parse(document.getElementById('livekit-token').textContent);
        const livekitUrl = JSON.parse(document.getElementById('livekit-url').textContent);
        
        let room; // LiveKit Room instance
        let isScreenSharing = false;

        // UI Elements
        const videoGrid = document.getElementById('video-grid');
        const localVideo = document.getElementById('local-video');
        const btnMic = document.getElementById('btn-toggle-mic');
        const btnCam = document.getElementById('btn-toggle-cam');
        const btnScreen = document.getElementById('btn-share-screen');

        function updateGridTemplate() {
            const numVideos = videoGrid.children.length;
            videoGrid.className = ''; 
            if (numVideos === 2) videoGrid.classList.add('grid-2');
            else if (numVideos >= 3 && numVideos <= 4) videoGrid.classList.add('grid-4');
            else if (numVideos >= 5 && numVideos <= 6) videoGrid.classList.add('grid-6');
            else if (numVideos >= 7) videoGrid.classList.add('grid-9');
        }

        async function start() {
            // Initialize LiveKit Room
            room = new LivekitClient.Room({
                adaptiveStream: true,
                dynacast: true,
            });

            // Set up event listeners for LiveKit
            room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                if (track.kind === LivekitClient.Track.Kind.Video) {
                    attachVideoTrack(track, participant);
                } else if (track.kind === LivekitClient.Track.Kind.Audio) {
                    const audioElement = track.attach();
                    document.body.appendChild(audioElement);
                }
            });

            room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
                if (track.kind === LivekitClient.Track.Kind.Video) {
                    removeVideoTrack(participant);
                } else if (track.kind === LivekitClient.Track.Kind.Audio) {
                    track.detach();
                }
            });

            room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
                removeVideoTrack(participant);
            });

            room.on(LivekitClient.RoomEvent.DataReceived, (payload, participant) => {
                const strData = new TextDecoder().decode(payload);
                const data = JSON.parse(strData);
                if (data.action === 'chat_message') {
                    appendChatMessage(participant.identity, data.message, false);
                }
            });

            try {
                await room.connect(livekitUrl, livekitToken);
                console.log('Connected to LiveKit Room:', room.name);

                // Publish local camera and mic
                await room.localParticipant.setCameraEnabled(true);
                await room.localParticipant.setMicrophoneEnabled(true);

                // Attach local video manually to our predefined element
                const localVideoTrack = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
                if (localVideoTrack && localVideoTrack.track) {
                    localVideoTrack.track.attach(localVideo);
                }

                // Handle local track modifications
                room.localParticipant.on('localTrackPublished', (publication) => {
                    if (publication.source === LivekitClient.Track.Source.Camera) {
                        publication.track.attach(localVideo);
                    }
                });

            } catch (error) {
                console.error("Could not connect to LiveKit", error);
                alert("Lỗi kết nối tới Server. Bạn đã chạy LiveKit Server qua Docker chưa?");
            }

            // Chat Form Submit
            document.getElementById('chat-form').onsubmit = function(e) {
                e.preventDefault();
                const msgInput = document.getElementById('chat-message-input');
                const msg = msgInput.value.trim();
                if (msg !== "") {
                    const payload = new TextEncoder().encode(JSON.stringify({
                        'action': 'chat_message',
                        'message': msg
                    }));
                    room.localParticipant.publishData(payload, LivekitClient.DataPacket_Kind.RELIABLE);
                    appendChatMessage("Bạn", msg, true);
                    msgInput.value = '';
                }
            };
        }

        function attachVideoTrack(track, participant) {
            let containerId = 'video-container-' + participant.sid;
            let container = document.getElementById(containerId);
            
            if (!container) {
                container = document.createElement('div');
                container.id = containerId;
                container.className = 'video-container';
                
                const vid = document.createElement('video');
                vid.id = 'video-' + participant.sid;
                vid.autoplay = true;
                vid.playsInline = true;
                
                const label = document.createElement('div');
                label.className = 'video-label';
                label.innerText = participant.identity;
                
                container.appendChild(vid);
                container.appendChild(label);
                videoGrid.appendChild(container);
                updateGridTemplate();
            }
            
            // LiveKit automatically handles attaching to the video element
            track.attach(document.getElementById('video-' + participant.sid));
        }

        function removeVideoTrack(participant) {
            const container = document.getElementById('video-container-' + participant.sid);
            if(container) {
                container.remove();
                updateGridTemplate();
            }
        }

        function appendChatMessage(user, message, isMe=false) {
            const chatLog = document.getElementById('chat-log');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex flex-col ' + (isMe ? 'items-end' : 'items-start');
            
            if (isMe) {
                messageDiv.innerHTML = `
                    <span class="text-xs text-gray-400 mb-1 mr-1">Bạn</span>
                    <div class="px-4 py-2 text-sm chat-bubble-me max-w-[85%] break-words">
                        ${message}
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <span class="text-xs text-gray-400 mb-1 ml-1">${user}</span>
                    <div class="px-4 py-2 text-sm chat-bubble-other max-w-[85%] break-words shadow-sm">
                        ${message}
                    </div>
                `;
            }
            chatLog.appendChild(messageDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // Toggle Mic
        btnMic.onclick = async () => {
            const isEnabled = room.localParticipant.isMicrophoneEnabled;
            await room.localParticipant.setMicrophoneEnabled(!isEnabled);
            if (!isEnabled) { // It was disabled, now enabled
                btnMic.classList.replace('btn-inactive', 'btn-active');
                btnMic.innerText = '🎤';
            } else {
                btnMic.classList.replace('btn-active', 'btn-inactive');
                btnMic.innerText = '🔇';
            }
        };

        // Toggle Camera
        btnCam.onclick = async () => {
            if (isScreenSharing) return;
            const isEnabled = room.localParticipant.isCameraEnabled;
            await room.localParticipant.setCameraEnabled(!isEnabled);
            
            if (!isEnabled) {
                btnCam.classList.replace('btn-inactive', 'btn-active');
                btnCam.innerText = '📷';
            } else {
                btnCam.classList.replace('btn-active', 'btn-inactive');
                btnCam.innerText = '🚫';
            }
        };

        // Share Screen
        btnScreen.onclick = async () => {
            if (!isScreenSharing) {
                try {
                    await room.localParticipant.setScreenShareEnabled(true);
                    isScreenSharing = true;
                    btnScreen.classList.replace('btn-inactive', 'btn-active');

                    // If we want local preview of screen share, we can attach it to localVideo
                    const screenTrack = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.ScreenShare);
                    if (screenTrack && screenTrack.track) {
                        screenTrack.track.attach(localVideo);
                        
                        // Handle native stop sharing
                        screenTrack.track.mediaStreamTrack.onended = () => {
                            stopScreenSharing();
                        };
                    }
                } catch (e) {
                    console.error("Error sharing screen", e);
                }
            } else {
                await stopScreenSharing();
            }
        };

        async function stopScreenSharing() {
            await room.localParticipant.setScreenShareEnabled(false);
            isScreenSharing = false;
            btnScreen.classList.replace('btn-active', 'btn-inactive');
            
            // Revert local video to camera
            const cameraTrack = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
            if (cameraTrack && cameraTrack.track) {
                cameraTrack.track.attach(localVideo);
            }
        }

        // Start
        window.onload = start;
    </script>
</body>
</html>
