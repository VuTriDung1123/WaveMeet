{% extends "chat/base.html" %}

{% block content %}
<div class="text-center">
    <h2 class="text-3xl font-bold text-gray-800 mb-2">Hello, {{ user.username }}! 🌸</h2>
    <p class="text-gray-600 mb-8">Welcome to WaveMeet Dashboard</p>
    
    <div class="space-y-4">
        <button class="w-full py-3 rounded-full font-bold kawaii-btn">
            Tạo Phòng Mới
        </button>
        <button class="w-full py-3 rounded-full font-bold bg-white text-pink-500 border-2 border-pink-500 hover:bg-pink-50 transition-all shadow-sm hover:shadow-md">
            Tham Gia Phòng
        </button>
    </div>

    <form method="post" action="{% url 'logout' %}" class="mt-8">
        {% csrf_token %}
        <button type="submit" class="text-sm text-gray-500 hover:text-red-500 underline">Đăng xuất</button>
    </form>
</div>
{% endblock %}
